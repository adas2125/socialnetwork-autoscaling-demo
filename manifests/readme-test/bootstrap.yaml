# Test namespaces and the same Redis limits used in README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: readme-test-app
---
apiVersion: v1
kind: Namespace
metadata:
  name: readme-test-redis
---
apiVersion: v1
kind: LimitRange
metadata:
  name: foxtrot-default-limits
  namespace: readme-test-redis
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
---
apiVersion: v1
kind: Namespace
metadata:
  name: readme-test-mongo
